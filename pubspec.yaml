name: ecommerce_firebase
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # Firebase packages
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_messaging: ^16.0.0
  firebase_analytics: ^12.0.0

  # Authentication
  google_sign_in: ^6.1.6

  # State management
  provider: ^6.1.1

  # UI components
  cached_network_image: ^3.3.0
  carousel_slider: ^5.1.1
  smooth_page_indicator: ^1.2.1
  # Utilities
  uuid: ^4.2.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Qwerty
      fonts:
        - asset: assets/fonts/qwerty.ttf
    - family: Ytrewq
      fonts:
        - asset: assets/fonts/ytrewq.ttf
    - family: Dartguy
      fonts:
        - asset: assets/fonts/dartguy.ttf
    - family: Mawi
      fonts:
        - asset: assets/fonts/ojuju.ttf

# Flutter launcher icons config
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
